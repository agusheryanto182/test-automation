name: Release PR

# Opens (or keeps open) a develop -> main PR. Merging it stays manual on purpose.
# Uses the bot app token so the PR triggers CI (GITHUB_TOKEN PRs don't).
on:
  schedule:
    - cron: '0 10 * * *' # 17:00 WIB
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Open develop -> main PR if develop is ahead
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/main...develop" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "develop is not ahead of main, nothing to do"
            exit 0
          fi
          pr=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            echo "Release PR #$pr already open"
            exit 0
          fi
          gh pr create --base main --head develop \
            --title "chore: merge develop into main ($(date -u +%Y-%m-%d))" \
            --body "Automated release PR: $ahead commit(s) from develop. Review and merge manually."
