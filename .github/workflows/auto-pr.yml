name: Auto PR

# When the Claude agent pushes a claude/issue-N-* branch: open a PR to develop
# (if none exists) and enable auto-merge, so it merges once CI is green.
on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Open PR and enable auto-merge
        run: |
          num=$(echo "$BRANCH" | sed -nE 's#^claude/issue-([0-9]+)-.*#\1#p')
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            if [ -n "$num" ]; then
              title=$(gh issue view "$num" --json title --jq .title)
              body="Closes #$num"
            else
              title="$BRANCH"
              body="Opened automatically from \`$BRANCH\`."
            fi
            gh pr create --base develop --head "$BRANCH" --title "$title" \
              --body "$body"$'\n\n'"Opened by the Auto PR workflow. Merges automatically once CI passes."
          fi
          gh pr merge "$BRANCH" --auto --squash --delete-branch
